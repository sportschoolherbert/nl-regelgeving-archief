name: rvs

# Raad van State: eerst alle adviezen, dan de uitspraken die niet op rechtspraak.nl staan (html van
# raadvanstate.nl). robots.txt vraagt crawl-delay 30 en dat respecteren we: een verbinding, 30 s
# tussen verzoeken, een job tegelijk voor de hele site (max-parallel 1 + concurrency-groep).
# Shards van 500 pagina's (~4,3 uur). Het schema pakt elke 6 uur de volgende open shards op tot alles
# binnen is; als alles klaar is, is de run een no-op.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Optioneel: komma-lijst van shards (rvs-adv000, rvs-uit000), leeg = wat nog open is"
        required: false
        default: ""
permissions: { contents: read }
concurrency:
  group: rvs
  cancel-in-progress: false
env:
  GD_CLIENT_ID: ${{ secrets.GD_CLIENT_ID }}
  GD_CLIENT_SECRET: ${{ secrets.GD_CLIENT_SECRET }}
  GD_REFRESH_TOKEN: ${{ secrets.GD_REFRESH_TOKEN }}
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - id: p
        run: python rvs.py prep
        env: { SHARDS: "${{ inputs.shards }}", RVS_PAUZE: "30" }
      - uses: actions/upload-artifact@v4
        with:
          name: rvs-plan
          path: rvs_plan/
          retention-days: 3
  shard:
    needs: prep
    if: needs.prep.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: ${{ fromJson(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rvs-plan
          path: rvs_plan/
      - run: pip install requests
      - run: python rvs.py run ${{ matrix.shard }}
        env: { TIJDGRENS_MIN: "300", RVS_PAUZE: "30" }
