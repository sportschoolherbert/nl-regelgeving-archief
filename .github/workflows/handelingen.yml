name: handelingen

# Handelingen, Aanhangsel (Kamervragen), Kamervragen zonder antwoord en overige
# Staten-Generaal-publicaties na 1994 (niet-Kamerstuk). xml + pdf, shards van 5000.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Optioneel: komma-lijst van shards (h-000, aa-000, kz-000, ov-000), leeg = wat nog open is"
        required: false
        default: ""
permissions: { contents: read }
env:
  GD_CLIENT_ID: ${{ secrets.GD_CLIENT_ID }}
  GD_CLIENT_SECRET: ${{ secrets.GD_CLIENT_SECRET }}
  GD_REFRESH_TOKEN: ${{ secrets.GD_REFRESH_TOKEN }}
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - id: p
        run: python handelingen.py prep
        env: { SHARDS: "${{ inputs.shards }}" }
      - uses: actions/upload-artifact@v4
        with:
          name: handelingen-plan
          path: parlement_plan/
          retention-days: 3
  shard:
    needs: prep
    if: needs.prep.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJson(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: handelingen-plan
          path: parlement_plan/
      - run: pip install requests
      - run: python handelingen.py run ${{ matrix.shard }}
        env: { TIJDGRENS_MIN: "260" }
