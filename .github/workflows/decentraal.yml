name: decentraal

# Decentrale bladen (Gemeenteblad, Provinciaal blad, Waterschapsblad, Blad gemeenschappelijke
# regeling) vanaf 2013: xml (en pdf, behalve Gemeenteblad) uit de SRU-repository, naar map 08.
# Shards = vaste datumperiodes tot ±30.000 stukken; tijdgrens zodat de 6-uurslimiet niet toeslaat.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Optioneel: komma-lijst van shards (gmb-20190101-20190201), leeg = wat nog open is"
        required: false
        default: ""
permissions: { contents: read }
env:
  GD_CLIENT_ID: ${{ secrets.GD_CLIENT_ID }}
  GD_CLIENT_SECRET: ${{ secrets.GD_CLIENT_SECRET }}
  GD_REFRESH_TOKEN: ${{ secrets.GD_REFRESH_TOKEN }}
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - id: p
        run: python decentraal.py prep
        env: { SHARDS: "${{ inputs.shards }}" }
      - uses: actions/upload-artifact@v4
        with:
          name: decentraal-plan
          path: decentraal_plan/
          retention-days: 3
  shard:
    needs: prep
    if: needs.prep.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ${{ fromJson(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: decentraal-plan
          path: decentraal_plan/
      - run: pip install requests
      - run: python decentraal.py run ${{ matrix.shard }}
        env: { TIJDGRENS_MIN: "270" }
