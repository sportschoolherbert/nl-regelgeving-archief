name: tucht

# Alle gepubliceerde tuchtuitspraken (tuchtrecht.overheid.nl), xml + pdf via de SRU van
# repository.overheid.nl. Shards van 2500 uitspraken, maximaal 3 tegelijk.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Optioneel: komma-lijst van shards (tucht-000), leeg = wat nog open is"
        required: false
        default: ""
permissions: { contents: read }
env:
  GD_CLIENT_ID: ${{ secrets.GD_CLIENT_ID }}
  GD_CLIENT_SECRET: ${{ secrets.GD_CLIENT_SECRET }}
  GD_REFRESH_TOKEN: ${{ secrets.GD_REFRESH_TOKEN }}
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - id: p
        run: python tucht.py prep
        env: { SHARDS: "${{ inputs.shards }}" }
      - uses: actions/upload-artifact@v4
        with:
          name: tucht-plan
          path: tucht_plan/
          retention-days: 3
  shard:
    needs: prep
    if: needs.prep.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ${{ fromJson(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tucht-plan
          path: tucht_plan/
      - run: pip install requests
      - run: python tucht.py run ${{ matrix.shard }}
        env: { TIJDGRENS_MIN: "300" }
