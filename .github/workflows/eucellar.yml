name: eucellar

# EU-aanvulling via Cellar: vervallen wetgeving, voorbereidende handelingen (COM e.d.) en
# conclusies van de advocaten-generaal, Nederlandstalig, naar map 01 (index naar map 00).
# Shards van 12.000 CELEX-nummers; tijdgrens per job zodat GitHub de job niet na 6 uur afbreekt.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Optioneel: komma-lijst van shards (wet-000,com-001), leeg = wat nog open is"
        required: false
        default: ""
permissions: { contents: read }
env:
  GD_CLIENT_ID: ${{ secrets.GD_CLIENT_ID }}
  GD_CLIENT_SECRET: ${{ secrets.GD_CLIENT_SECRET }}
  GD_REFRESH_TOKEN: ${{ secrets.GD_REFRESH_TOKEN }}
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - id: p
        run: python eucellar.py prep
        env: { SHARDS: "${{ inputs.shards }}" }
      - uses: actions/upload-artifact@v4
        with:
          name: eucellar-plan
          path: eucellar_plan/
          retention-days: 3
  shard:
    needs: prep
    if: needs.prep.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ${{ fromJson(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: eucellar-plan
          path: eucellar_plan/
      - run: pip install requests
      - run: python eucellar.py run ${{ matrix.shard }}
        env: { TIJDGRENS_MIN: "250" }
